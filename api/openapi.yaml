            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      summary: "Revoke a pending invitation"
      description: |-
        Revokes a pending invitation so that its token can no longer be redeemed.
        Requires `iam.users.invite`, the same authority that issued it; a `CLIENT`
        principal cannot hold the code and receives `404`. Revocation is a status
        change, not a row deletion, so the record of who invited whom survives. An
        invitation that has already been accepted cannot be revoked and is refused with
        `409` — act on the resulting account instead. Success is `204`.
      tags: ["Invitations"]
      x-access: Authenticated
      x-required-permission: "iam.users.invite"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: "The invitation was revoked."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/permissions:
    get:
      operationId: listPermissions
      summary: "The permission catalogue"
      description: |-
        Returns the whole permission catalogue: every code, the module it belongs to,
        its principal-type envelope and whether it is classed as dangerous. Requires
        `iam.permissions.read`, an `INTERNAL`-only permission, so a `CLIENT` caller sees
        `404`. The catalogue is compiled into the binary rather than stored, so this is
        a fixed list and not a paginated collection: there are no `cursor`, `limit` or
        `sort` parameters. `max_principal_type: ANY` marks the only two codes a `CLIENT`
        principal may ever hold, both of them `client.portal.*`.
      tags: ["Authorization"]
      x-access: Authenticated
      x-required-permission: "iam.permissions.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
