          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "A page of client-visible tasks."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTaskPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/client-portal/tasks/{id}:
    get:
      operationId: getClientPortalTask
      summary: "Read one client-visible task"
      description: |-
        Reads one client-visible task in the reduced client projection, with
        `internal_note` and the internal identifiers physically absent from the type.
        Requires `client.portal.tasks.read` and no step-up; it is one of the four routes
        an external `CLIENT` principal may reach. A task that is not marked
        `client_visible`, or whose project is not shared with the caller, yields `404`
        and never `403`, so the response cannot be used to probe which task ids are
        real. There is no write endpoint anywhere in the portal: it is read-only by
        construction, asserted by a test over the route table.
      tags: ["Client Portal"]
      x-access: Authenticated
      x-required-permission: "client.portal.tasks.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL", "CLIENT"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The reduced task projection."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/settings:
    get:
      operationId: listSettings
      summary: "Read every system setting"
      description: |-
        Returns every system setting with its current value, type and metadata. Requires
        `settings.read` — `INTERNAL` only, so a `CLIENT` caller sees `404` — and no
        step-up. It is a fixed catalogue rather than a paginated collection, so there
        are no `cursor`, `limit` or `sort` parameters. `is_security_sensitive` marks the
        settings whose modification is itself a security event, and those are the ones a
        reviewer should watch for in the audit log.
      tags: ["Settings"]
      x-access: Authenticated
      x-required-permission: "settings.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "Every setting."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/settings/{key}:
    put:
      operationId: updateSetting
      summary: "Write one system setting"
      description: |-
        Writes the value of one system setting, identified by the key in the path.
        Requires `settings.features.write` — `INTERNAL` only, so an external caller sees
        `404` — and no step-up. The key is not a member of the body: a body that also
        carried the key would let it retarget a write that the URL authorised.
        `is_security_sensitive`, `value_type` and `description` are likewise not
        writable, because being able to re-describe a setting is being able to pick
        which permission guards it. `version` is mandatory and a stale one is `409
        VERSION_CONFLICT`; an unknown key is `404`.
      tags: ["Settings"]
      x-access: Authenticated
      x-required-permission: "settings.features.write"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: key
          in: path
          required: true
          description: "The setting or feature-flag key."
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-z0-9][a-z0-9._-]{0,99}$" }
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingRequest' }
      responses:
        '200':
          description: "The updated setting."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Setting' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/feature-flags:
    get:
      operationId: listFeatureFlags
      summary: "Read every feature flag"
      description: |-
        Returns every feature flag together with whether it is currently enabled.
        Requires `settings.read` — `INTERNAL` only, so a `CLIENT` caller sees `404` —
        and no step-up. It is a fixed catalogue rather than a paginated collection, so
        no `cursor`, `limit` or `sort` is accepted. A flag is a product switch and never
        an access control: `client_portal = false` hides the portal, but it is the
        `client.portal.*` permissions and the `CLIENT` envelope that actually stop an
        external user reading a project.
      tags: ["Settings"]
      x-access: Authenticated
      x-required-permission: "settings.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "Every feature flag."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/feature-flags/{key}:
    put:
      operationId: updateFeatureFlag
      summary: "Turn one feature flag on or off"
      description: |-
        Turns one feature flag on or off, identified by the key in the path. Requires
        `settings.features.write` — `INTERNAL` only, so an external caller sees `404` —
        and no step-up; the permission is deliberately not classed as dangerous, because
        it is meant to be delegable to whoever runs the product. `version` is mandatory
        for the same reason as on settings, a blind overwrite never being the default,
        and a stale one is `409 VERSION_CONFLICT`. An unknown key is `404`, and the key
        is never taken from the body.
      tags: ["Settings"]
      x-access: Authenticated
      x-required-permission: "settings.features.write"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: key
          in: path
          required: true
          description: "The setting or feature-flag key."
          schema: { type: string, minLength: 1, maxLength: 100, pattern: "^[a-z0-9][a-z0-9._-]{0,99}$" }
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFeatureFlagRequest' }
      responses:
        '200':
          description: "The updated flag."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: "Minimal environment description for an authenticated client"
      description: |-
        Returns a minimal description of the running environment: the environment name,
        whether the system has been initialised, and the list of enabled feature keys.
        Any authenticated session may call it, internal or external, and no permission
        is required — which is exactly why it says so little. Deliberately absent are
        build and version identifiers, the schema version, hostnames, the database, the
        mail provider, pool statistics, uptime and the permission catalogue; each of
        those would turn a routine authenticated read into reconnaissance for whoever
        phishes one low-privilege account. `enabled_features` is a flat list of string
        keys and never a list of objects.
      tags: ["System"]
      x-access: Authenticated
      x-required-permission: null
      x-requires-step-up: false
      x-principal-types: ["INTERNAL", "CLIENT"]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The environment description."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: "Read the audit log"
      description: |-
        Reads the audit log, cursor-paginated, with filters for `action_code`,
        `actor_user_id`, `target_type`, `target_id`, `outcome` and an occurred-at range.
        Requires `audit.read` — `INTERNAL` only, so a `CLIENT` caller sees `404` — and
        no step-up. The log is read-only: there is no endpoint anywhere that writes,
        edits, deletes or purges an audit event, and adding one would need an ADR rather
        than a pull request. Each event carries its sequence number and chain hash,
        which is what `GET /api/v1/audit/verify` recomputes.
      tags: ["Audit"]
      x-access: Authenticated
      x-required-permission: "audit.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - name: action_code
          in: query
          required: false
          description: "Exact match on the action code, e.g. `ROLE.ASSIGNED`."
          schema: { type: string, maxLength: 200 }
        - name: actor_user_id
          in: query
          required: false
          description: "Restrict to one actor."
          schema: { type: string, format: uuid }
        - name: target_type
          in: query
          required: false
          description: "Restrict to one target type."
          schema: { $ref: '#/components/schemas/ResourceType' }
        - name: target_id
          in: query
          required: false
          description: "Restrict to one target object."
          schema: { type: string, format: uuid }
        - name: outcome
          in: query
          required: false
          description: "Restrict to one outcome."
          schema: { $ref: '#/components/schemas/AuditOutcome' }
        - name: occurred_from
          in: query
          required: false
          description: "Inclusive lower bound, RFC 3339."
          schema: { type: string, format: date-time }
        - name: occurred_to
          in: query
          required: false
          description: "Exclusive upper bound, RFC 3339."
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "A page of audit events, newest first by default."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/audit/events/{id}:
    get:
      operationId: getAuditEvent
      summary: "Read one audit event"
      description: |-
        Reads one audit event by id, including its sequence number, chain hash and the
        structured detail recorded with it. Requires `audit.read` — `INTERNAL` only, so
        a `CLIENT` caller sees `404` — and no step-up. An unknown id is `404`. There is
        no way to modify what comes back, because audit history has no mutation path at
        all.
      tags: ["Audit"]
      x-access: Authenticated
      x-required-permission: "audit.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The audit event."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/audit/verify:
    get:
      operationId: verifyAuditChain
      summary: "Verify the audit hash chain"
      description: |-
        Recomputes the HMAC-SHA256 hash chain over the requested `from_seq`–`to_seq`
        range and reports the first sequence number at which it breaks, if any. Requires
        `audit.read` **and** step-up, which is unusual for a `GET`: it mutates nothing,
        but it is expensive enough to be a denial-of-service lever, and step-up is the
        cheapest way to keep it out of casual reach. A `CLIENT` principal cannot hold
        `audit.read` and is answered `404`. The claim this endpoint supports is precise
        — modification, deletion or reordering performed without the chain key is
        detectable — and it is not a claim of tamper-proofing against an adversary
        holding both the database and the key. An invalid range is `400
        VALIDATION_FAILED`.
      tags: ["Audit"]
      x-access: Authenticated
      x-required-permission: "audit.read"
      x-requires-step-up: true
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: from_seq
          in: query
          required: false
          description: "Inclusive lower bound on `seq`. Defaults to the first event."
          schema: { type: integer, format: int64, minimum: 1 }
        - name: to_seq
          in: query
          required: false
          description: "Inclusive upper bound on `seq`. Defaults to the latest event."
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The verification result."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

components:

  # ===========================================================================
  # Security
  # ===========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        `Authorization: Bearer <token>` and nothing else. No cookies, no query
        parameters, no custom headers, no basic auth.

        **The token is an opaque server-side session token, not a JWT.** It has no
        readable payload, no signature a client can verify and no claims: it is
        random material whose only meaning is the row it selects in the session
        store. Do not attempt to decode it, do not cache decisions derived from it,
        and do not assume it will keep its current length. Server-side sessions are
        used precisely so that revocation is immediate — a self-contained token
        stays valid until it expires no matter what the server decides in the
        meantime.

        Access tokens are prefixed `rb_at_` and live 15 minutes; refresh tokens are
        prefixed `rb_rt_`, rotate on every use and are single-use. Presenting an
        already-redeemed refresh token is treated as theft and revokes the whole
        session family.

        **A token must never be placed in a URL** — not in the path, not in the
        query string. URLs are written to proxy logs, kept in browser history and
        forwarded in `Referer`. The server rejects any attempt to authenticate that
        way; it is not a supported fallback. For the same reason the password-reset
        and invitation-acceptance tokens travel in the request body.

  # ===========================================================================
  # Reusable headers
  # ===========================================================================
  headers:
    XRequestId:
      description: |-
        The request correlation id in force for this request. Echoed on every
        response, present in every log line and stored on every audit row. Quote it
        when reporting a failure.
      schema: { type: string, minLength: 8, maxLength: 64 }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, format: int32, minimum: 0 }

  # ===========================================================================
  # Reusable parameters
  # ===========================================================================
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: |-
        Opaque keyset cursor taken from `next_cursor` of the previous page. Opaque on
        purpose: an encoded blob discourages hand-crafted cursors and lets the internal
        representation change without breaking clients. It is **not** a security
        boundary — it is not signed, and a forged cursor can only reposition a query
        the caller was already authorised to run. A malformed cursor is
        `400 VALIDATION_FAILED` with a field error on `cursor`.
      schema: { type: string, maxLength: 64 }
    Limit:
      name: limit
      in: query
      required: false
      description: |-
        Page size. Defaults to 25. A value below 1 or above 100 is
        `400 VALIDATION_FAILED` with field code `OUT_OF_RANGE`; a deployment may
        configure a lower cap, which a client cannot override.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 25 }
    Sort:
      name: sort
      in: query
      required: false
      description: |-
        The public name of a sortable field. Each endpoint has a compile-time
        allowlist mapping a public name to a static SQL expression; the supplied
        string is only ever compared, never interpolated. A value outside the
        allowlist is `400 VALIDATION_FAILED` with field code `NOT_ALLOWED`, and the
        error names the permitted set but never echoes what was rejected.
      schema: { type: string, maxLength: 50 }
    Direction:
      name: direction
      in: query
      required: false
      description: Sort direction. Lowercase only; `ASC` is rejected.
      schema: { type: string, enum: [asc, desc], default: desc }
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |-
        A client-supplied correlation id. **Accepted but not trusted**: it is used only
        if it is 8–64 characters of ASCII alphanumerics, `-` and `_`. Anything else is
        silently discarded and the server generates its own — a rejected value is not
        an error. The adopted value is echoed on the response.
      schema: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        Makes this creation safely retryable. The key is scoped to
        `(principal, operation, key)`, so one principal's key can never replay
        another's response.

        Replaying the same key with the same body returns the stored response
        verbatim. Replaying it with a **different** body is `409
        IDEMPOTENCY_KEY_REUSED`; a retry that arrives while the first is still in
        flight is also `409`. Records are retained for 24 hours.

        8–200 printable ASCII characters, no spaces and no control characters. A UUID
        is a good choice.
      schema: { type: string, minLength: 8, maxLength: 200, pattern: "^[!-~]+$" }

  # ===========================================================================
  # Reusable error responses. Every one is RFC 9457 application/problem+json.
  # ===========================================================================
  responses:
    BadRequest:
      description: |-
        The request could not be understood or failed validation. `code` is
        `VALIDATION_FAILED` (with an `errors` array), `BAD_REQUEST`, or
        `UNKNOWN_PERMISSION` when the caller supplied a permission code outside the
        catalogue. There is no `422` in this API.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: |-
        `code: AUTHENTICATION_FAILED`. Deliberately undifferentiated: an unknown
        account, a wrong password, an expired token, a revoked session, a malformed
        bearer header and a suspended user all render identically, because any
        distinction is an account-enumeration oracle.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |-
        The caller is authenticated but the operation is refused. `code` is one of
        `AUTHORIZATION_DENIED`, `STEP_UP_REQUIRED` (with a `step_up.window_seconds`
        hint so the client re-prompts rather than gives up), `MFA_REQUIRED` when the
        session has not completed its second factor, `DELEGATION_DENIED` when the
        actor tried to grant authority it does not itself hold, or `ROOT_PROTECTED`
        when the target was the system owner.

        An external `CLIENT` principal receives `404` instead of this status wherever
        a `403` would confirm that an object exists.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |-
        `code: RESOURCE_NOT_FOUND`. Also returned in place of `403` to external
        principals, so that a refusal does not confirm the existence of an object they
        should not know about.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |-
        The request conflicts with the current state. `code` is `VERSION_CONFLICT` for
        stale optimistic concurrency, `IDEMPOTENCY_KEY_REUSED`,
        `SYSTEM_ALREADY_INITIALIZED`, or one of the domain conflict codes such as
        `UNIQUE_VIOLATION`, `EMAIL_IN_USE`, `ROLE_IN_USE` or
        `DEPARTMENT_HAS_LIVE_PROJECTS`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: '`code: PAYLOAD_TOO_LARGE`. The body exceeds the accepted size and was not read.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: '`code: UNSUPPORTED_MEDIA_TYPE`. Every body-bearing endpoint accepts `application/json` only.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`code: RATE_LIMITED`. `Retry-After` carries the wait in seconds.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: |-
        `code: INTERNAL_ERROR`. The cause is logged against `request_id` and is never
        returned. Quote `request_id` when reporting the failure.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: '`code: SERVICE_UNAVAILABLE`. A required dependency is unavailable; retry shortly. The failing dependency is never named.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  # ===========================================================================
  # Schemas
  # ===========================================================================
  schemas:

    # ---- errors -------------------------------------------------------------
    FieldError:
      type: object
      description: One rejected field inside a `VALIDATION_FAILED` problem.
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Dotted path to the offending field, e.g. `name` or `members.0.user_id`.
          examples: ["display_name", "members.0.user_id"]
        code:
          type: string
          description: |-
            Stable, machine-readable reason. Branch on this, not on `message`.
          enum:
            - REQUIRED
            - TOO_SHORT
            - TOO_LONG
            - INVALID
            - INVALID_FORMAT
            - INVALID_TYPE
            - INVALID_VALUE
            - INVALID_SCOPE
            - OUT_OF_RANGE
            - NOT_ALLOWED
            - NOT_EDITABLE
            - DUPLICATE
            - TOO_MANY
            - TOO_COMMON
            - CONTAINS_IDENTITY
        message:
          type: string
          description: |-
            Human hint. **Never echoes the rejected value** — echoing it back is how a
            validation error becomes a reflection gadget and a log-injection vector.

    Problem:
      type: object
      description: |-
        RFC 9457 problem details. Served as `application/problem+json` with
        `Cache-Control: no-store`.

        Two rules govern this shape. **Machine clients branch on `code`, never on
        prose** — `title` and `detail` are human text and may be reworded at any time.
        And **`detail` never carries an internal fact**: no SQL, no backtrace, no file
        path, no environment variable, no secret, no database hostname. Internal causes
        are logged against `request_id` and the client is told only that something
        failed.
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
          description: |-
            `https://roleblank.internal/problems/<lowercased code>`. Deliberately not a
            live URL: resolving it must never be required to handle an error, and
            pointing at an external host would leak error occurrence to that host.
          examples: ["https://roleblank.internal/problems/authorization_denied"]
        title:
          type: string
          description: Short human summary. Not stable; do not match on it.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The HTTP status, repeated in the body.
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: |-
            The stable contract identifier. The first eighteen values are the fixed
            arms of the error type and are exhaustive for every status other than
            `409`. `409` additionally carries a domain conflict code; the ones the
            services construct today are listed after them.
          enum:
            - VALIDATION_FAILED
            - BAD_REQUEST
            - UNKNOWN_PERMISSION
            - AUTHENTICATION_FAILED
            - AUTHORIZATION_DENIED
            - STEP_UP_REQUIRED
            - MFA_REQUIRED
            - ROOT_PROTECTED
            - DELEGATION_DENIED
            - RESOURCE_NOT_FOUND
            - VERSION_CONFLICT
            - IDEMPOTENCY_KEY_REUSED
            - SYSTEM_ALREADY_INITIALIZED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
            - UNIQUE_VIOLATION
            - REFERENCE_VIOLATION
            - INVARIANT_VIOLATION
            - IDEMPOTENCY_RACE
            - EMAIL_IN_USE
            - UNKNOWN_USER
            - ALREADY_A_MEMBER
            - PRINCIPAL_TYPE_MISMATCH
            - ROLE_ALREADY_ASSIGNED
            - ROLE_IN_USE
            - SELF_TARGET_REFUSED
            - SUBJECT_ARCHIVED
            - INVALID_STATUS_TRANSITION
            - DEPARTMENT_ARCHIVED
            - DEPARTMENT_ALREADY_ARCHIVED
            - DEPARTMENT_HAS_LIVE_PROJECTS
        detail:
          type: string
          description: Client-safe explanation. Audited for information leakage.
        request_id:
          type: string
          description: Correlation id, matching the `X-Request-Id` response header.
        errors:
          type: array
          description: Present only when `code` is `VALIDATION_FAILED`.
          items: { $ref: '#/components/schemas/FieldError' }
        step_up:
          type: object
          description: Present only when `code` is `STEP_UP_REQUIRED`.
          required: [window_seconds]
          properties:
            window_seconds:
              type: integer
              format: int64
              description: |-
                How recently the second factor must have been verified, in seconds.
                Re-verify through the MFA endpoints and retry.

    # ---- pagination ---------------------------------------------------------
    PageMeta:
      type: object
      description: |-
        The pagination envelope shared by every collection response. Keyset
        pagination throughout: there is no `page`, no `offset` and no `total`. An
        offset would let a client turn a cheap endpoint into an expensive one by
        incrementing a number, and a total requires a second scan of the whole
        matching set on every request.
      required: [has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to fetch the next page. `null` on the last page.
          maxLength: 64
        has_more:
          type: boolean
          description: Whether a further page exists.

    # ---- shared enumerations ------------------------------------------------
    PrincipalType:
      type: string
      description: |-
        The security envelope a human principal lives inside. Not a role and not
        changeable by role assignment: it is fixed when the account is created and
        caps the authority the account can ever hold, before any grant is consulted.
      enum: [INTERNAL, CLIENT]
    UserStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, ARCHIVED]
      description: Account lifecycle. `ARCHIVED` is terminal; there is no delete.
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
    DepartmentStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ClientStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, ARCHIVED]
    ClientMembershipStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, REMOVED]
      description: A membership grants visibility only while it is `ACTIVE`.
    ProjectStatus:
      type: string
      enum: [ACTIVE, PAUSED, COMPLETED, ARCHIVED]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, BLOCKED, DONE, CANCELLED]
    TaskPriority:
      type: string
      enum: [LOW, NORMAL, HIGH, URGENT]
    MembershipRole:
      type: string
      enum: [MEMBER, LEAD]
      description: Role within a department or project. Not a permission role.
    ScopeType:
      type: string
      description: |-
        How wide a grant reaches. Five variants, no more. `RESOURCE` names one object
        and is expressible only on a per-user override, never on a role: a role is a
        reusable template and cannot name a specific object.
      enum: [GLOBAL, DEPARTMENT, ASSIGNED, SELF, RESOURCE]
    RoleScopeType:
      type: string
      description: The four scopes a role grant may carry. `RESOURCE` is absent by design.
      enum: [GLOBAL, DEPARTMENT, ASSIGNED, SELF]
    Effect:
      type: string
      enum: [ALLOW, DENY]
      description: A `DENY` override beats every `ALLOW` from any source.
    ResourceType:
      type: string
      enum: [PROJECT, TASK, DEPARTMENT, CLIENT_ACCOUNT, USER]
    AuditOutcome:
      type: string
      enum: [SUCCESS, DENIED, FAILURE]

    # ---- system -------------------------------------------------------------
    HealthResponse:
      type: object
      description: |-
        One field, and its value is one of two constants. There is deliberately no
        `checks`, `details`, `version` or `error` member: a readiness body that names
        the failing dependency tells an unauthenticated caller the shape of the
        deployment.
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, not_ready] }

    SystemInfo:
      type: object
      required: [environment, initialized, enabled_features]
      additionalProperties: false
      properties:
        environment:
          type: string
          enum: [development, staging, production]
          description: One of three fixed words. A client legitimately renders differently against a development instance.
        initialized:
          type: boolean
          description: Whether bootstrap has happened. Already observable anonymously, so disclosing it here costs nothing.
        enabled_features:
          type: array
          description: The feature-flag keys that are on. Keys only — never a description, never a sensitivity marker, never a value.
          items: { type: string }

    # ---- bootstrap ----------------------------------------------------------
    BootstrapStatus:
      type: object
      required: [initialized]
      additionalProperties: false
      properties:
        initialized:
          type: boolean
          description: |-
            `false` means bootstrap is still available. One boolean and deliberately
            nothing else: version, hostname, user count or build id would each be free
            reconnaissance handed to whoever finds the deployment first.

    BootstrapRootRequest:
      type: object
      description: |-
        Four fields, and it cannot carry a fifth: unknown members are rejected before
        the service is entered. `principal_type`, `status`, `is_root`, `mfa_required`,
        `role_ids` and `security_version` are not fields of this request, so the
        owner's security envelope cannot be chosen by the caller — it is written as
        SQL literals.
      required: [bootstrap_secret, email, display_name, password]
      additionalProperties: false
      properties:
        bootstrap_secret:
          type: string
          description: |-
            The out-of-band operator secret, compared in constant time against the
            deployment's configured value. Never logged, never audited, never echoed.
          writeOnly: true
          minLength: 1
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        password:
          type: string
          format: password
          writeOnly: true
          description: The owner's password. Never defaulted — a hardcoded owner credential would be a backdoor surviving every deployment of the image.

    BootstrapRootResponse:
      type: object
      description: |-
        No token and no session. The owner must log in through the ordinary
        authentication path and enrol a second factor, which is what makes bootstrap
        incapable of minting a privileged session by itself.
      required: [user_id, email, display_name, mfa_enrolment_required, initialized_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        mfa_enrolment_required:
          type: boolean
          const: true
          description: Always `true`. The owner is created with `mfa_required` set and no factor enrolled, so their first session can reach nothing but the MFA endpoints.
        initialized_at: { type: string, format: date-time }

    # ---- authentication -----------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, writeOnly: true }

    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          writeOnly: true
          description: The `rb_rt_` token from a previous issue. Single use.

    TokenResponse:
      type: object
      description: |-
        The single response shape for login, refresh and any other token issue. This is
        the only place in the system where plaintext token material exists after
        generation: it is serialised into the response and dropped.
      required: [access_token, refresh_token, expires_in, mfa_required, token_type]
      additionalProperties: false
      properties:
        access_token:
          type: string
          description: 'Opaque session token, prefixed `rb_at_`. Send it in the `Authorization` header as a bearer credential. Never put it in a URL.'
        refresh_token:
          type: string
          description: Opaque rotation token, prefixed `rb_rt_`. Single use; reuse revokes the session family.
        expires_in:
          type: integer
          format: int64
          description: Lifetime of `access_token` in seconds — **not** of the session.
          examples: [900]
        mfa_required:
          type: boolean
          description: |-
            `true` when this session may reach only the MFA endpoints and
            `GET /api/v1/auth/me`. Complete a factor to clear it.
        token_type: { type: string, const: Bearer }

    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, format: password, writeOnly: true }
        new_password: { type: string, format: password, writeOnly: true }

    PasswordResetRequestRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }

    PasswordResetAccepted:
      type: object
      description: |-
        A fixed constant with no variable field. Identical for an existing account, a
        non-existent account and a structurally invalid address — it is a struct with
        nothing to vary precisely so that no future edit can make it depend on the
        account.
      required: [status, detail]
      additionalProperties: false
      properties:
        status: { type: string, const: accepted }
        detail: { type: string }

    PasswordResetConfirmRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
          writeOnly: true
          description: The reset token from the email. In the body, never in the URL.
        new_password: { type: string, format: password, writeOnly: true }

    CodeRequest:
      type: object
      description: A presented one-time code — TOTP for activation and verification, or a recovery code.
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, writeOnly: true, minLength: 6, maxLength: 32 }

    Capability:
      type: object
      description: One permission the principal holds, with every scope it holds it at.
      required: [permission, scopes]
      additionalProperties: false
      properties:
        permission: { type: string }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/ScopeType' }

    Me:
      type: object
      description: |-
        The full projection, returned to a session that has satisfied every
        requirement. `capabilities` is a *hint* for hiding buttons; the backend
        re-derives every decision on every request regardless of what the client
        believes.
      required:
        [user_id, email, display_name, principal_type, is_root, security_version,
         session_id, auth_level, mfa_enrolled, mfa_required, mfa_pending,
         step_up_active, capabilities]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        is_root: { type: boolean, description: True only for the single system owner. }
        security_version:
          type: integer
          format: int32
          description: Bumped on every privilege change, so a client can see that its capability set moved.
        session_id: { type: string, format: uuid }
        auth_level: { type: string, examples: ["MFA"] }
        mfa_enrolled: { type: boolean }
        mfa_required: { type: boolean }
        mfa_pending: { type: boolean, const: false }
        step_up_active:
          type: boolean
          description: Recomputed per request from the session's verification time. Never a stored flag — a cached boolean keeps saying "recently verified" after the window closes.
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/Capability' }

    PendingMfaMe:
      type: object
      description: |-
        The reduced projection for a session that has not completed MFA. A
        structurally smaller document rather than the full one with fields hidden: the
        capability list must be *absent*, not merely omitted by an attribute a later
        refactor could drop. A session that cannot call a business endpoint has no
        business learning which business endpoints it would be allowed to call.
        `is_root` and `auth_level` are absent for the same reason.
      required:
        [user_id, email, display_name, principal_type, security_version, session_id,
         mfa_enrolled, mfa_required, mfa_pending, step_up_active, next_action]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        security_version: { type: integer, format: int32 }
        session_id: { type: string, format: uuid }
        mfa_enrolled: { type: boolean }
        mfa_required: { type: boolean }
        mfa_pending: { type: boolean, const: true }
        step_up_active: { type: boolean, const: false }
        next_action:
          type: string
          enum: [MFA_ENROLLMENT_REQUIRED, MFA_VERIFICATION_REQUIRED]
          description: Which of the two MFA flows the client should start.

    MeProjection:
      description: |-
        One of two structurally different documents. Discriminate on `mfa_pending`.
      oneOf:
        - $ref: '#/components/schemas/Me'
        - $ref: '#/components/schemas/PendingMfaMe'

    SessionSummary:
      type: object
      description: |-
        `id` is safe to expose: a session id is not a credential and the token digest
        is not derivable from it.
      required:
        [id, current, auth_level, created_at, last_activity_at, access_expires_at,
         idle_expires_at, absolute_expires_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean, description: Whether this is the session making the request. }
        auth_level: { type: string }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        access_expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        absolute_expires_at:
          type: string
          format: date-time
          description: The ceiling. No amount of refreshing extends it.
        client_ip_hint:
          type: [string, "null"]
          description: Recognition aid only. Never used for authorisation.
        user_agent_hint:
          type: [string, "null"]
          description: Recognition aid only. Never used for authorisation.

    SessionListResponse:
      type: object
      required: [sessions]
      additionalProperties: false
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionSummary' }

    RevocationResponse:
      type: object
      required: [revoked_sessions]
      additionalProperties: false
      properties:
        revoked_sessions: { type: integer, format: int64 }

    TotpEnrolment:
      type: object
      description: |-
        The one response in this API that carries a secret, and it carries it exactly
        once. `secret` and `otpauth_uri` are shown at setup and can never be read back,
        because at rest the factor holds only authenticated ciphertext. Render the URI
        as a QR code and discard it.
      required: [factor_id, secret, otpauth_uri, algorithm, digits, period]
      additionalProperties: false
      properties:
        factor_id: { type: string, format: uuid }
        secret: { type: string, description: "Base32, no padding — what an authenticator app expects." }
        otpauth_uri: { type: string, format: uri }
        algorithm: { type: string, examples: ["SHA1"] }
        digits: { type: integer, format: int32, examples: [6] }
        period: { type: integer, format: int64, examples: [30] }

    RecoveryCodes:
      type: object
      description: Shown once. Only SHA-256 digests are stored, so they cannot be re-read.
      required: [codes, generated]
      additionalProperties: false
      properties:
        codes:
          type: array
          items: { type: string }
        generated: { type: integer, format: int32 }

    MfaActivated:
      type: object
      required: [mfa_enrolled, auth_level, step_up_active, recovery_codes]
      additionalProperties: false
      properties:
        mfa_enrolled: { type: boolean, const: true }
        auth_level: { type: string }
        step_up_active: { type: boolean }
        recovery_codes: { $ref: '#/components/schemas/RecoveryCodes' }

    MfaVerified:
      type: object
      required: [mfa_required, auth_level, step_up_active]
      additionalProperties: false
      properties:
        mfa_required:
          type: boolean
          const: false
          description: Always `false` after a successful verification — the session is no longer restricted to the MFA endpoints.
        auth_level: { type: string }
        step_up_active: { type: boolean }
        recovery_codes_remaining:
          type: [integer, "null"]
          format: int64
          description: Present only on the recovery-code path, so a user can see the batch draining and regenerate before running out.

    MfaDisabled:
      type: object
      required: [mfa_enrolled]
      additionalProperties: false
      properties:
        mfa_enrolled: { type: boolean, const: false }

    # ---- registration -------------------------------------------------------
    RegistrationConfig:
      type: object
      description: Two fields and nothing more. It must not disclose the configured mode name.
      required: [registration_available, registration_type]
      additionalProperties: false
      properties:
        registration_available: { type: boolean }
        registration_type:
          type: [string, "null"]
          enum: [client, null]
          description: '`client` when self-registration is on, `null` otherwise. Self-registration can only ever create a `CLIENT` principal.'

    RegisterRequest:
      type: object
      description: |-
        Three fields. There is no field for `principal_type`, none for `role_ids`, none
        for `status`, and unknown members are rejected — mass assignment is refused by
        the type, not by a service check somebody could forget to write.
      required: [email, display_name, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, format: password, writeOnly: true }

    RegistrationAccepted:
      type: object
      description: A constant, byte for byte identical whether or not the address could be registered.
      required: [registration_status, message]
      additionalProperties: false
      properties:
        registration_status: { type: string, const: SUBMITTED }
        message: { type: string }

    # ---- invitations --------------------------------------------------------
    CreateInvitationRequest:
      type: object
      description: |-
        `department_id` is meaningful only for an `INTERNAL` invitation and
        `client_account_id` only for a `CLIENT` one; the database refuses the other
        combination outright.
      required: [email, display_name, principal_type]
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        role_ids:
          type: array
          default: []
          description: Roles to grant on acceptance. Validated against the inviter's own authority now, and again at acceptance.
          items: { type: string, format: uuid }
        department_id: { type: [string, "null"], format: uuid }
        client_account_id: { type: [string, "null"], format: uuid }

    Invitation:
      type: object
      description: There is no field here the invitation token could occupy; it exists only in the email that was sent.
      required:
        [id, email, display_name, principal_type, status, invited_by, role_ids,
         expires_at, created_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        invited_by: { type: string, format: uuid }
        department_id: { type: [string, "null"], format: uuid }
        client_account_id: { type: [string, "null"], format: uuid }
        role_ids:
          type: array
          items: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        accepted_user_id: { type: [string, "null"], format: uuid }

    InvitationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Invitation' }

    AcceptInvitationRequest:
      type: object
      description: The token travels in the body, never in the path or the query string.
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string, writeOnly: true, description: "The `rb_iv_` token from the invitation email." }
        password: { type: string, format: password, writeOnly: true }
        display_name:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: Optional override of the name the inviter supplied.

    AcceptInvitationResponse:
      type: object
      description: No session and no token. The new account must log in through the ordinary path.
      required: [user_id, email, display_name, principal_type, status, mfa_enrolment_required]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        status: { $ref: '#/components/schemas/UserStatus' }
        mfa_enrolment_required: { type: boolean }

    # ---- users --------------------------------------------------------------
    User:
      type: object
      description: |-
        The internal user projection. `email_normalized` is deliberately absent, and
        there is no field capable of holding a password hash — the hash lives in a
        different table, so the query that runs on every authenticated request
        physically cannot return one.
      required:
        [id, email, display_name, principal_type, status, mfa_required, mfa_enrolled,
         security_version, version, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        status: { $ref: '#/components/schemas/UserStatus' }
        mfa_required: { type: boolean }
        mfa_enrolled: { type: boolean }
        security_version: { type: integer, format: int32, minimum: 1 }
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic-concurrency token. Send it back on any mutation.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        activated_at: { type: [string, "null"], format: date-time }
        suspended_at: { type: [string, "null"], format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/User' }

    UpdateUserRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        display_name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        email: { type: [string, "null"], format: email, minLength: 3, maxLength: 254 }

    SuspendUserRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        reason: { type: [string, "null"], maxLength: 1000, description: Recorded on the audit event. }

    ReactivateUserRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }

    ArchiveUserRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        reason: { type: [string, "null"], maxLength: 1000 }

    # ---- authorization ------------------------------------------------------
    Permission:
      type: object
      required: [code, module, max_principal_type, is_dangerous]
      additionalProperties: false
      properties:
        code: { type: string, examples: ["projects.read"] }
        module: { type: string }
        max_principal_type:
          type: string
          enum: [INTERNAL, ANY]
          description: '`INTERNAL` = internal principals only. `ANY` = a `CLIENT` may hold it, and only the `client.portal.*` codes are like that.'
        is_dangerous:
          type: boolean
          description: Granting *or* exercising it requires a recent step-up.

    PermissionCatalogue:
      type: object
      description: The whole catalogue. It is compiled into the binary, so it is a fixed list rather than a paginated collection.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Permission' }

    RolePermissionInput:
      type: object
      description: |-
        One `(permission, scope)` pair inside a role. There is deliberately no
        `resource_type` or `resource_id`: a role cannot name a specific object, so the
        fields a `RESOURCE` scope would need are physically absent rather than
        validated away.
      required: [permission_code, scope]
      additionalProperties: false
      properties:
        permission_code: { type: string }
        scope: { $ref: '#/components/schemas/RoleScopeType' }

    RoleGrant:
      type: object
      required: [permission_code, scope]
      additionalProperties: false
      properties:
        permission_code: { type: string }
        scope: { $ref: '#/components/schemas/RoleScopeType' }

    CreateRoleRequest:
      type: object
      required: [code, name, allowed_principal_type]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, "null"], maxLength: 1000 }
        allowed_principal_type:
          $ref: '#/components/schemas/PrincipalType'
          description: Fixed at creation. Changing it later would move an existing permission set across the client envelope.
        permissions:
          type: array
          default: []
          items: { $ref: '#/components/schemas/RolePermissionInput' }

    UpdateRoleRequest:
      type: object
      description: |-
        `code` and `allowed_principal_type` are absent on purpose and cannot be changed
        here.
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        name: { type: [string, "null"], minLength: 1, maxLength: 150 }
        description: { type: [string, "null"], maxLength: 1000 }
        permissions:
          type: [array, "null"]
          description: |-
            Absent means "leave the permission set alone"; present means "replace it
            with exactly this". An explicit empty array is a legitimate request to
            strip the role bare.
          items: { $ref: '#/components/schemas/RolePermissionInput' }

    RoleSummary:
      type: object
      description: |-
        Deliberately not closed with `additionalProperties: false`, because
        `RoleDetail` composes it with `allOf`; a closed base would make that
        composition unsatisfiable.
      required: [id, code, name, description, is_system, allowed_principal_type, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean, description: A system role cannot be deleted and its code is fixed by seed data. }
        allowed_principal_type: { $ref: '#/components/schemas/PrincipalType' }
        version: { type: integer, format: int32, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RolePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RoleSummary' }

    RoleDetail:
      allOf:
        - $ref: '#/components/schemas/RoleSummary'
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              items: { $ref: '#/components/schemas/RoleGrant' }

    AssignRoleRequest:
      type: object
      description: The subject comes from the path, never from the body.
      required: [role_id]
      additionalProperties: false
      properties:
        role_id: { type: string, format: uuid }

    UserRole:
      type: object
      required: [role_id, code, name, is_system, allowed_principal_type, granted_at]
      additionalProperties: false
      properties:
        role_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        is_system: { type: boolean }
        allowed_principal_type: { $ref: '#/components/schemas/PrincipalType' }
        granted_by: { type: [string, "null"], format: uuid }
        granted_at: { type: string, format: date-time }

    UserRoles:
      type: object
      required: [user_id, items]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    EffectiveCapability:
      type: object
      required: [permission_code, scopes]
      additionalProperties: false
      properties:
        permission_code: { type: string }
        scopes:
          type: array
          description: Every scope the subject effectively holds for this permission.
          items: { $ref: '#/components/schemas/ScopeType' }

    EffectivePermissions:
      type: object
      description: |-
        A hint for user interfaces, exactly like `capabilities` on the current
        principal. The backend re-derives every decision per request regardless of
        what a client believes.
      required: [user_id, principal_type, is_root, items]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        principal_type: { $ref: '#/components/schemas/PrincipalType' }
        is_root: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/EffectiveCapability' }

    CreateOverrideRequest:
      type: object
      description: |-
        `resource_type` and `resource_id` are required with, and only with, `RESOURCE`
        scope. The subject is taken from the path.
      required: [permission_code, effect, scope]
      additionalProperties: false
      properties:
        permission_code: { type: string }
        effect: { $ref: '#/components/schemas/Effect' }
        scope: { $ref: '#/components/schemas/ScopeType' }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        resource_id: { type: [string, "null"], format: uuid }
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Must be in the future when present. A time-boxed override is preferable to a permanent one.
        reason: { type: [string, "null"], maxLength: 1000 }

    PermissionOverride:
      type: object
      required: [id, user_id, permission_code, effect, scope, reason, granted_by, granted_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        permission_code: { type: string }
        effect: { $ref: '#/components/schemas/Effect' }
        scope: { $ref: '#/components/schemas/ScopeType' }
        resource_type: { type: [string, "null"] }
        resource_id: { type: [string, "null"], format: uuid }
        expires_at: { type: [string, "null"], format: date-time }
        reason: { type: string }
        granted_by: { type: string, format: uuid }
        granted_at: { type: string, format: date-time }

    PermissionOverrideList:
      type: object
      description: |-
        The raw overrides for one subject. Not the resolved permission set —
        `EffectivePermissions` is that, and it is what a user interface should read.
      required: [user_id, items]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/PermissionOverride' }

    # ---- departments --------------------------------------------------------
    Department:
      type: object
      required: [id, code, name, description, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/DepartmentStatus' }
        lead_user_id: { type: [string, "null"], format: uuid }
        version: { type: integer, format: int32, minimum: 1 }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    DepartmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Department' }

    CreateDepartmentRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: [string, "null"], maxLength: 1000 }
        lead_user_id:
          type: [string, "null"]
          format: uuid
          description: Must be an `INTERNAL` principal.

    UpdateDepartmentRequest:
      type: object
      description: '`code` is immutable. An explicit `null` on `lead_user_id` detaches the lead; omitting the member leaves it alone.'
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        name: { type: [string, "null"], minLength: 1, maxLength: 150 }
        description: { type: [string, "null"], maxLength: 1000 }
        lead_user_id: { type: [string, "null"], format: uuid }

    ArchiveDepartmentRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }

    AddDepartmentMemberRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid, description: Must be an `INTERNAL` principal. }
        role_in_department: { $ref: '#/components/schemas/MembershipRole' }

    DepartmentMember:
      type: object
      required: [user_id, display_name, email, role_in_department, joined_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        role_in_department: { $ref: '#/components/schemas/MembershipRole' }
        joined_at: { type: string, format: date-time }

    DepartmentMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DepartmentMember' }

    # ---- clients ------------------------------------------------------------
    Client:
      type: object
      description: An external client business. Not a tenant — there is one company and one database.
      required: [id, code, name, description, status, version, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        status: { $ref: '#/components/schemas/ClientStatus' }
        account_manager_user_id:
          type: [string, "null"]
          format: uuid
          description: Company staff. Must be an `INTERNAL` principal.
        version: { type: integer, format: int32, minimum: 1 }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }

    ClientPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Client' }

    CreateClientRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 1000 }
        account_manager_user_id: { type: [string, "null"], format: uuid }

    UpdateClientRequest:
      type: object
      description: '`code` is immutable.'
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 1000 }
        status:
          type: [string, "null"]
          enum: [ACTIVE, SUSPENDED, null]
          description: '`ARCHIVED` is not reachable here; archival has its own endpoint.'
        account_manager_user_id: { type: [string, "null"], format: uuid }

    ArchiveClientRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        reason: { type: [string, "null"], maxLength: 1000 }

    AddClientMemberRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: Must be a `CLIENT` principal. The membership starts `PENDING` and grants nothing until activated.

    ClientMember:
      type: object
      required: [user_id, client_account_id, display_name, email, status, created_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        client_account_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/ClientMembershipStatus' }
        invited_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        activated_at:
          type: [string, "null"]
          format: date-time
          description: When the membership became live. Until then it granted no visibility at all.
        removed_at: { type: [string, "null"], format: date-time }

    ClientMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ClientMember' }

    # ---- projects -----------------------------------------------------------
    Project:
      type: object
      description: |-
        The **internal** project projection. Compare `ClientProject`, which is a
        separate, smaller type rather than this one with fields filtered out.
      required:
        [id, code, name, description, status, manager_user_id, internal_note, version,
         created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        manager_user_id: { type: string, format: uuid, description: Always an `INTERNAL` principal. }
        department_id: { type: [string, "null"], format: uuid }
        start_date: { type: [string, "null"], format: date }
        target_date: { type: [string, "null"], format: date }
        internal_note:
          type: string
          maxLength: 5000
          description: Internal-only. Physically absent from `ClientProject`.
        version: { type: integer, format: int32, minimum: 1 }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    ProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Project' }

    CreateProjectRequest:
      type: object
      required: [code, name, manager_user_id]
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,49}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        manager_user_id: { type: string, format: uuid }
        department_id: { type: [string, "null"], format: uuid }
        start_date: { type: [string, "null"], format: date }
        target_date: { type: [string, "null"], format: date, description: Must not precede `start_date`. }
        internal_note: { type: [string, "null"], maxLength: 5000 }

    UpdateProjectRequest:
      type: object
      description: |-
        `code` is immutable and `status` may not be set to `ARCHIVED` here.
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 5000 }
        status:
          type: [string, "null"]
          enum: [ACTIVE, PAUSED, COMPLETED, null]
        manager_user_id: { type: [string, "null"], format: uuid }
        department_id: { type: [string, "null"], format: uuid }
        start_date: { type: [string, "null"], format: date }
        target_date: { type: [string, "null"], format: date }
        internal_note: { type: [string, "null"], maxLength: 5000 }

    ArchiveProjectRequest:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        reason: { type: [string, "null"], maxLength: 1000 }

    AddProjectMemberRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid, description: Must be an `INTERNAL` principal. }
        role_in_project: { $ref: '#/components/schemas/MembershipRole' }

    ProjectMember:
      type: object
      required: [user_id, display_name, email, role_in_project, added_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        role_in_project: { $ref: '#/components/schemas/MembershipRole' }
        added_by: { type: [string, "null"], format: uuid }
        added_at: { type: string, format: date-time }

    ProjectMemberPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectMember' }

    ShareProjectRequest:
      type: object
      description: |-
        There is deliberately no `tasks` and no `include_tasks` member: sharing a
        project can never be a way to share its tasks.
      required: [client_account_id]
      additionalProperties: false
      properties:
        client_account_id: { type: string, format: uuid }
        note: { type: [string, "null"], maxLength: 500 }

    ProjectClientLink:
      type: object
      required: [client_account_id, client_code, client_name, client_status, note, shared_by, shared_at]
      additionalProperties: false
      properties:
        client_account_id: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        client_status: { $ref: '#/components/schemas/ClientStatus' }
        note: { type: string, maxLength: 500 }
        shared_by: { type: string, format: uuid }
        shared_at: { type: string, format: date-time }

    ProjectClientLinkPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProjectClientLink' }

    # ---- tasks --------------------------------------------------------------
    Task:
      type: object
      description: |-
        The **internal** task projection. Compare `ClientTask`, which is a separate,
        smaller type.
      required:
        [id, project_id, title, description, status, priority, client_visible,
         internal_note, version, created_at, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 10000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: [string, "null"], format: date }
        client_visible:
          type: boolean
          description: |-
            Per task, defaults to `false`, and **not** inherited from the project.
            Sharing a project with a client must never silently expose its task list.
        internal_note:
          type: string
          maxLength: 5000
          description: Internal-only. Physically absent from `ClientTask`.
        version: { type: integer, format: int32, minimum: 1 }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    TaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Task' }

    CreateTaskRequest:
      type: object
      required: [project_id, title]
      additionalProperties: false
      properties:
        project_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: [string, "null"], maxLength: 10000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: [string, "null"], format: date }
        client_visible:
          type: boolean
          default: false
          description: Setting this true is the deliberate act that exposes the task to the client portal.
        internal_note: { type: [string, "null"], maxLength: 5000 }

    UpdateTaskRequest:
      type: object
      description: '`project_id` is immutable: moving a task between projects would move it across a visibility boundary silently.'
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, format: int32, minimum: 1 }
        title: { type: [string, "null"], minLength: 1, maxLength: 300 }
        description: { type: [string, "null"], maxLength: 10000 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: [string, "null"], format: date }
        client_visible: { type: [boolean, "null"] }
        internal_note: { type: [string, "null"], maxLength: 5000 }

    AddTaskAssigneeRequest:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid, description: Must be an `INTERNAL` principal. }

    TaskAssignee:
      type: object
      required: [user_id, display_name, email, assigned_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        assigned_by: { type: [string, "null"], format: uuid }
        assigned_at: { type: string, format: date-time }

    # ---- client-portal projections ------------------------------------------
    ClientProject:
      type: object
      description: |-
        The reduced project projection returned to an external `CLIENT` principal.

        **The reduction is a security boundary, not a convenience.** This is a separate
        type from `Project`, not the same document with fields filtered at
        serialisation time: `internal_note`, `created_by`, `manager_user_id`,
        `department_id` and `version` are physically absent, so there is no attribute,
        no flag and no refactor that can make them appear. Filtering at serialisation
        would leave the fields present in the type and one careless edit away from the
        wire. `department_id` is withheld along with the rest because an external
        principal must not learn that departments exist at all.
      required: [id, code, name, description, status, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        start_date: { type: [string, "null"], format: date }
        target_date: { type: [string, "null"], format: date }
        completed_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    ClientProjectPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ClientProject' }

    ClientTask:
      type: object
      description: |-
        The reduced task projection returned to an external `CLIENT` principal.

        **The reduction is a security boundary, not a convenience.** Like
        `ClientProject`, this is a separate type from `Task`: `internal_note`,
        `created_by`, `client_visible`, assignee identities and `version` are
        physically absent. A task reaches this projection only when it is explicitly
        marked client-visible *and* its project is shared with a client account the
        caller actively belongs to; `client_visible` itself is not echoed, because a
        client has no use for a flag whose only false value it can never observe.
      required: [id, project_id, title, description, status, updated_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        due_date: { type: [string, "null"], format: date }
        completed_at: { type: [string, "null"], format: date-time }
        updated_at: { type: string, format: date-time }

    ClientTaskPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ClientTask' }

    # ---- settings -----------------------------------------------------------
    Setting:
      type: object
      required: [key, value, value_type, is_security_sensitive, description, version, updated_at]
      additionalProperties: false
      properties:
        key: { type: string, examples: ["registration.mode"] }
        value:
          description: Validated against `value_type` before it is written.
        value_type: { type: string, enum: [STRING, INTEGER, BOOLEAN, ENUM, JSON] }
        is_security_sensitive:
          type: boolean
          description: Marks a setting whose modification is itself a security event.
        description: { type: string }
        version: { type: integer, format: int32, minimum: 1 }
        updated_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    SettingList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Setting' }

    UpdateSettingRequest:
      type: object
      description: |-
        `key` is not a member: it comes from the path. A body that also carried the key
        would let it silently retarget a URL-authorised write.
      required: [value, version]
      additionalProperties: false
      properties:
        value:
          description: The new value. Validated against the stored `value_type`.
        version: { type: integer, format: int32, minimum: 1 }

    FeatureFlag:
      type: object
      required: [key, enabled, is_security_sensitive, description, version, updated_at]
      additionalProperties: false
      properties:
        key: { type: string }
        enabled: { type: boolean }
        is_security_sensitive: { type: boolean }
        description: { type: string }
        version: { type: integer, format: int32, minimum: 1 }
        updated_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    FeatureFlagList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeatureFlag' }

    UpdateFeatureFlagRequest:
      type: object
      required: [enabled, version]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        version: { type: integer, format: int32, minimum: 1 }

    # ---- audit --------------------------------------------------------------
    AuditEvent:
      type: object
      description: |-
        One row of the append-only log. `metadata` is a closed, sanitised structure
        written by the server — never a raw request body. Passwords, tokens of any
        kind, TOTP secrets, recovery codes and keys never appear in it.
      required: [seq, id, occurred_at, action_code, outcome, metadata]
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
          description: |-
            Position in the hash chain. A gapless monotonic sequence, so "a row was
            removed" is detectable on its own.
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_user_id: { type: [string, "null"], format: uuid }
        actor_principal_type:
          type: [string, "null"]
          enum: [INTERNAL, CLIENT, SYSTEM, null]
        actor_session_id: { type: [string, "null"], format: uuid }
        action_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*(\\.[A-Z][A-Z0-9_]*)*$"
          examples: ["ROLE.ASSIGNED", "USER.SUSPEND"]
        target_type: { type: [string, "null"], maxLength: 50 }
        target_id: { type: [string, "null"], format: uuid }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        request_id: { type: [string, "null"], maxLength: 64 }
        source_ip_hint: { type: [string, "null"], maxLength: 45 }
        metadata:
          type: object
          description: Sanitised, structured context for the event.
        prev_hash:
          type: [string, "null"]
          description: Hex-encoded 32-byte chain link of the previous entry. `null` for the first.
        entry_hash:
          type: string
          description: Hex-encoded 32-byte HMAC-SHA256 of this entry.

    AuditEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditEvent' }

    AuditVerification:
      type: object
      description: |-
        The result of recomputing the chain. `valid: false` with a `broken_at_seq`
        means the log was modified, reordered or truncated without the chain key —
        which is exactly the claim the chain supports, and no more.
      required: [valid, checked_from_seq, checked_to_seq, events_checked]
      additionalProperties: false
      properties:
        valid: { type: boolean }
        checked_from_seq: { type: integer, format: int64 }
        checked_to_seq: { type: integer, format: int64 }
        events_checked: { type: integer, format: int64 }
        broken_at_seq:
          type: [integer, "null"]
          format: int64
          description: The first sequence number at which the recomputed hash disagreed. `null` when `valid` is true.
        verified_at: { type: string, format: date-time }
