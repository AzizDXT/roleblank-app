        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - name: role_id
          in: path
          required: true
          description: "Identifier of the role."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: "The role was revoked."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/{id}/permissions:
    get:
      operationId: getEffectivePermissions
      summary: "A user's effective permissions"
      description: |-
        Returns a user's effective permissions: the union of role grants and direct
        overrides, after the principal-type envelope has been applied and after any
        `DENY` has won. Requires `iam.permissions.read` — `INTERNAL` only, so a `CLIENT`
        caller sees `404` — and no step-up. This is a hint for user interfaces, exactly
        like `capabilities` on `GET /api/v1/auth/me`: the backend re-derives every
        decision per request regardless of what a client believes. An external subject's
        list can only ever contain the two `client.portal.*` codes, which is asserted by
        a property test over random grants.
      tags: ["Authorization"]
      x-access: Authenticated
      x-required-permission: "iam.permissions.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The subject's effective capability set."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
