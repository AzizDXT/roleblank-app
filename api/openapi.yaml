      x-access: Authenticated
      x-required-permission: "iam.roles.update"
      x-requires-step-up: true
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: "The updated role."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteRole
      summary: "Delete a role"
      description: |-
        Deletes a role outright. Requires `iam.roles.delete` and step-up; a `CLIENT`
        principal cannot hold the code and receives `404`. A system role cannot be
        deleted, and a role still assigned to anybody is refused with `409 ROLE_IN_USE`
        rather than silently stripping its holders — revoke the assignments first.
        Success is `204`.
      tags: ["Authorization"]
      x-access: Authenticated
      x-required-permission: "iam.roles.delete"
      x-requires-step-up: true
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: "The role was deleted."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/{id}/roles:
    get:
      operationId: listUserRoles
      summary: "The roles assigned to a user"
      description: |-
        Lists the roles currently assigned to one user. Requires `iam.roles.read` —
        `INTERNAL` only, so an external caller sees `404` — and no step-up. It shows
        assignments only; to see what those roles actually confer once overrides and the
        principal envelope have been applied, use `GET /api/v1/users/{id}/permissions`.
