      x-access: Authenticated
      x-required-permission: "iam.roles.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The subject's role assignments."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoles' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: assignRoleToUser
      summary: "Assign a role to a user"
      description: |-
        Assigns a role to a user. Requires `iam.roles.assign`, which is classed as
        dangerous and is therefore always behind step-up (`403 STEP_UP_REQUIRED`
        otherwise); a `CLIENT` principal cannot hold it and sees `404`. It is refused
        with `403 DELEGATION_DENIED` when the role carries authority the actor does not
        itself hold, and with `409 PRINCIPAL_TYPE_MISMATCH` when the role's envelope
        does not match the subject's — that second check is what stops a `CLIENT`
        account ever acquiring an internal role. A successful assignment bumps the
        subject's `security_version`, and because tokens are opaque server-side handles
        rather than JWTs the new authority applies on the subject's very next request.
