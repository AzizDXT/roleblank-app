        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: "The role was created."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/roles/{id}:
    get:
      operationId: getRole
      summary: "Read one role with its grants"
      description: |-
        Reads one role together with its full grant list, which is what a reviewer needs
        in order to see what the role actually confers. Requires `iam.roles.read` —
        `INTERNAL` only, so a `CLIENT` caller sees `404` — and no step-up. An unknown id
        is `404`. The `version` in the response is the optimistic-concurrency token a
        subsequent `PATCH` must send back.
      tags: ["Authorization"]
      x-access: Authenticated
      x-required-permission: "iam.roles.read"
      x-requires-step-up: false
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "The role and its permission set."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateRole
      summary: "Update a role"
      description: |-
        Updates a role's name, description and permission set. Requires
        `iam.roles.update` and step-up, since editing a role edits authority; a `CLIENT`
        principal cannot hold the code and sees `404`. `code` and
        `allowed_principal_type` are immutable here — the code is referenced by
        operators and by seed data, and the principal type is the envelope the
        permission set was authorised against, so a different envelope means a different
        role. An absent `permissions` means leave the set alone, whereas an explicit
        empty array is a legitimate instruction to strip the role bare; `version` is
        mandatory and a stale one is `409 VERSION_CONFLICT`. Granting beyond the actor's
        own authority is `403 DELEGATION_DENIED`.
