      x-access: Authenticated
      x-required-permission: "iam.roles.assign"
      x-requires-step-up: true
      x-principal-types: ["INTERNAL"]
      parameters:
        - name: id
          in: path
          required: true
          description: "Identifier of the target resource."
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignRoleRequest' }
      responses:
        '201':
          description: "The role was assigned."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/{id}/roles/{role_id}:
    delete:
      operationId: revokeRoleFromUser
      summary: "Revoke a role from a user"
      description: |-
        Removes a role assignment from a user. Requires `iam.roles.assign` — the same
        dangerous permission that grants it — and is therefore behind step-up; a
        `CLIENT` principal sees `404`. It bumps the subject's `security_version`, so the
        reduced authority takes effect on their very next request and their clients can
        detect that the capability set moved. Revoking an assignment that does not exist
        is `404`; success is `204`.
      tags: ["Authorization"]
      x-access: Authenticated
      x-required-permission: "iam.roles.assign"
      x-requires-step-up: true
      x-principal-types: ["INTERNAL"]
