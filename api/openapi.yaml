        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
        - name: status
          in: query
          required: false
          description: "Restrict to one invitation status."
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: "A page of invitations."
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createInvitation
      summary: "Invite somebody to the system"
      description: |-
        Creates an invitation and sends it, which is the only path to an `INTERNAL`
        account — there is deliberately no `POST /api/v1/users`. Requires
        `iam.users.invite` (`INTERNAL` only, so a `CLIENT` caller sees `404`) and no
        step-up, but the requested role set is validated against the inviter's own
        authority now and again at acceptance, so an over-reaching invitation is `403
        DELEGATION_DENIED` immediately. It honours `Idempotency-Key`: the same key with
        the same body replays the stored response, while the same key with a different
        body is `409 IDEMPOTENCY_KEY_REUSED` rather than a silently wrong replay. There
        is one live invitation per address, so inviting the same person twice is a
        deterministic `409`, and the response has no field the token could occupy.
      tags: ["Invitations"]
      x-access: Authenticated
      x-required-permission: "iam.users.invite"
