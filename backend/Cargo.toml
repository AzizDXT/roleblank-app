[package]
name = "roleblank-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "RoleBlank OS — internal company operating system backend"
license = "UNLICENSED"

[lib]
name = "roleblank_backend"
path = "src/lib.rs"

[[bin]]
name = "roleblank-api"
path = "src/main.rs"

[dependencies]
# --- HTTP / async runtime ---------------------------------------------------
axum = { version = "0.8", features = ["macros", "json", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "set-header", "catch-panic", "normalize-path"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# --- Database ---------------------------------------------------------------
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate", "macros",
] }

# --- Serialization ----------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Identifiers / time -----------------------------------------------------
uuid = { version = "1", features = ["v7", "v4", "serde", "std"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# --- Cryptography (vetted RustCrypto stack) ---------------------------------
argon2 = { version = "0.5", features = ["std", "password-hash"] }
password-hash = { version = "0.5", features = ["std"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.9"
rand_core = { version = "0.9", features = ["os_rng"] }
zeroize = { version = "1", features = ["derive"] }
data-encoding = "2"

# --- Observability ----------------------------------------------------------
tracing = "0.1"
# `time` enables the RFC 3339 UTC timestamp formatter. Without it the default
# timer emits an uptime duration, which is useless for correlating across services.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "std", "time"] }

# --- Mail -------------------------------------------------------------------
# The only production delivery mechanism. Deliberately narrow: SMTP over TLS and
# nothing else. `default-features = false` keeps the file/sendmail transports and
# the native-tls stack out of the tree — rustls is already here through sqlx, and
# two TLS implementations would mean two to audit.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport", "tokio1", "tokio1-rustls", "builder", "ring", "webpki-roots",
] }

# --- Misc -------------------------------------------------------------------
thiserror = "2"
dotenvy = "0.15"
async-trait = "0.1"

[dev-dependencies]
proptest = "1"
# Integration tests link against the library plus dev-dependencies only — a
# regular dependency is NOT automatically available to `tests/`. Everything the
# harness in tests/common/mod.rs touches has to be repeated here.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["json"] }
http-body-util = "0.1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "time", "json", "migrate",
] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
serde_json = "1"
data-encoding = "2"

[features]
default = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false

[profile.dev]
opt-level = 0
debug = 1

# Tests exercise Argon2id and TOTP; without optimisation they are unusably slow.
[profile.test.package.argon2]
opt-level = 3
[profile.test.package.sha2]
opt-level = 3
[profile.test.package.chacha20poly1305]
opt-level = 3
